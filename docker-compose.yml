services:
  # Produksi: Nginx menyajikan static build MyShelf (PWA) di port 7004
  myshelf:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: myshelf-app
    restart: unless-stopped
    ports:
      - '7004:80'

  # Mode Pengembangan: Vite Dev Server dengan Hot Module Replacement (HMR) di port 5173
  dev:
    image: node:22-alpine
    container_name: myshelf-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - NODE_ENV=development
    profiles:
      - dev
